<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Surpresa Romântica ❤️</title>

<style>
body {
  margin: 0;
  background: radial-gradient(circle, #1a0000, black);
  font-family: 'Georgia', serif;
  text-align: center;
  overflow: hidden;
}

/* TELA INICIAL */
#inicio {
  position: fixed;
  width: 100%;
  height: 100%;
  background: black;
  color: gold;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 10;
}

#inicio button {
  padding: 15px 30px;
  font-size: 18px;
  background: gold;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

/* CONTAINER */
#container {
  display: none;
  margin-top: 20px;
}

/* CANVAS */
canvas {
  border-radius: 20px;
  box-shadow: 0 0 25px gold;
  background: url("foto.jpg") center / cover no-repeat;
}

#dica {
  position: absolute;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  color: #ffd700;
  font-size: 18px;
  text-shadow: 1px 1px 4px black;
  pointer-events: none;
  opacity: 1;
  transition: opacity 0.5s ease;
  animation: piscar 1.2s infinite alternate;
}

@keyframes piscar {
  from { opacity: 1; }
  to { opacity: 0.3; }
}

/* TEXTO */
#texto {
  position: absolute;
  top: 25%;
  left: 10%;
  width: 80%;
  color: #ffd700;
  font-size: 18px;
  text-shadow: 2px 2px 6px black;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.5s ease;
}

/* CORAÇÕES */
.heart {
  position: absolute;
  font-size: 22px;
  animation: subir 6s linear infinite;
}

@keyframes subir {
  0% { transform: translateY(0); opacity: 1; }
  100% { transform: translateY(-900px); opacity: 0; }
}
</style>
</head>

<body>

<!-- ✅ TELA INICIAL -->
<div id="inicio">
  <h1>💌 Uma surpresa pra você meu amor</h1>
  <button onclick="iniciar()">Abrir ❤️</button>
</div>

<!-- ✅ CONTEÚDO -->
<div id="container">

  <div style="position:relative; width:320px; margin:auto;">
    <canvas id="canvas" width="320" height="500"></canvas>
    <div id="dica">Raspe aqui</div>

    <!-- ✏️ EDITAR TEXTO AQUI -->
    <div id="texto">
      Para você amor da minha vida Marlene 💖<br><br>
      Desde que você entrou na minha vida,<br>
      tudo ficou mais bonito...<br><br>

      Você é meu melhor presente.<br><br>

      Feliz Aniversário de Casamento!<br><br>

      Te amo ❤️
    </div>
  </div>

</div>

<!-- 🎵 MUSICA -->
<audio id="musica" loop src="musica.mp3"></audio>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
const musica = document.getElementById("musica");
const texto = document.getElementById("texto");
const dica = document.getElementById("dica");
let textoRevelado = false;

/* ✅ BOTÃO INICIAR */
function iniciar() {
  document.getElementById("inicio").style.display = "none";
  document.getElementById("container").style.display = "block";
  musica.play();
}

/* ✅ IMAGEM */
ctx.fillStyle = "rgba(0,0,0,1)";
ctx.fillRect(0, 0, canvas.width, canvas.height);

/* ✅ RASPAR */
function revelar(x, y) {
  ctx.globalCompositeOperation = "destination-out";

  let g = ctx.createRadialGradient(x, y, 5, x, y, 40);
  g.addColorStop(0, "rgba(0,0,0,1)");
  g.addColorStop(1, "rgba(0,0,0,0)");

  ctx.fillStyle = g;
  ctx.beginPath();
  ctx.arc(x, y, 40, 0, Math.PI * 2);
  ctx.fill();

  if (!textoRevelado) {
    textoRevelado = true;
    texto.style.opacity = "1";
    dica.style.opacity = "0";
  }
}

/* ✅ TOUCH */
canvas.addEventListener("touchmove", e => {
  let rect = canvas.getBoundingClientRect();
  let x = e.touches[0].clientX - rect.left;
  let y = e.touches[0].clientY - rect.top;
  revelar(x, y);
});

/* ✅ MOUSE */
canvas.addEventListener("mousemove", e => {
  if (e.buttons === 1) {
    let rect = canvas.getBoundingClientRect();
    revelar(e.clientX - rect.left, e.clientY - rect.top);
  }
});

/* ✅ CORAÇÕES */
function criarCoracao() {
  let heart = document.createElement("div");
  heart.innerHTML = "❤️";
  heart.classList.add("heart");

  heart.style.left = Math.random() * window.innerWidth + "px";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 6000);
}

setInterval(criarCoracao, 300);
</script>

</body>
</html>
